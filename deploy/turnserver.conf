# coturn for warship.
#
# Long-term credentials: one shared username and password, set here and given
# to players. Simple, and appropriate while the players are people you know.
# The alternative is REST-API ephemeral credentials (use-auth-secret), where
# the signaling service mints a short-lived username/password per session from
# a shared secret. That is the right answer once the service is public --- it
# stops a leaked credential being a permanent free relay --- but it means the
# signaling service has to hand out credentials, which is exactly the kind of
# responsibility it currently does not have.

listening-port=3478
fingerprint
lt-cred-mech

# CHANGE BOTH OF THESE.
user=warship:change-me-before-deploying
realm=turn.example.com

# Relay ports. These must be open in the firewall or TURN fails with no useful
# error. Keep the range small; each concurrent game needs one port.
min-port=49160
max-port=49200

# libjuice does TURN over UDP only: juice_turn_server_t has no transport field.
# tls-listening-port=5349 would look reassuring in a firewall rule and do
# nothing, so it is deliberately absent.

# Do not let strangers use the relay to reach anything but each other.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-tlsv1
no-tlsv1_1
