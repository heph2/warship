# Signaling: pairs two players by room code and forwards opaque ICE payloads.
# It carries no game traffic and closes as soon as ICE connects, so it is an
# ordinary stateless HTTP workload with an unusually short-lived connection.
#
# Exposed as a NodePort and fronted by Caddy on sauron, matching how cuppy is
# already published from this cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warship-signal
  namespace: warship
spec:
  replicas: 1 # rooms live in memory: a second replica would split the pairing
  selector:
    matchLabels:
      app: warship-signal
  template:
    metadata:
      labels:
        app: warship-signal
    spec:
      containers:
        - name: signal
          image: ghcr.io/heph2/warship-signal:latest
          args: ["7777"]
          ports:
            - name: ws
              containerPort: 7777
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No HTTP health endpoint: the service speaks only websockets. A TCP
          # probe is the honest check for "is it accepting connections".
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: warship-signal
  namespace: warship
spec:
  type: NodePort
  selector:
    app: warship-signal
  ports:
    - name: ws
      port: 7777
      targetPort: ws
      nodePort: 30777
