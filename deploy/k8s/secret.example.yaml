# Do not commit the real thing. Either create it directly:
#
#   kubectl -n warship create secret generic coturn-credentials \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# or keep it in sops alongside the rest of the infra secrets. Players need the
# same value in WARSHIP_TURN_PASSWORD, so it is a shared password, not a
# per-user one --- see deploy/README.md on when that stops being good enough.
apiVersion: v1
kind: Secret
metadata:
  name: coturn-credentials
  namespace: warship
type: Opaque
stringData:
  password: change-me-before-deploying
