# nginx alternative to the Caddyfile. Certificates are your problem here;
# certbot is the usual answer.
#
# The three Upgrade/Connection/http_version lines are the whole trick. Without
# them nginx answers the handshake with a plain 200 and the client sees a
# websocket that never opens.

server {
    listen 443 ssl;
    http2 on;
    server_name signal.example.com;

    ssl_certificate     /etc/letsencrypt/live/signal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A room can sit idle while someone reads the code out over the phone.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
